<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multiplayer 5 Card Draw Poker</title>
  <style>
    :root {
      --bg: #0a4f2a;
      --table: #0d6d3d;
      --panel: rgba(255,255,255,0.06);
      --panel-border: rgba(255,255,255,0.1);
      --card-bg: #fffdf9;
      --text: #f4f3ee;
      --muted: #dfe8d8;
      --gold: #f4d26a;
      --accent: #3b7dff;
      --accent-dark: #255fdb;
      --danger: #ec5959;
      --success: #66d17a;
      --theme-bg: #0a4f2a;
      --theme-table: #0d6d3d;
      --card-back: #1d4f7d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--theme-bg);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1a7d48 0%, var(--theme-table) 30%, #062d1b 100%);
      transition: background 0.25s ease;
    }

    .wrap {
      width: min(1100px, 96vw);
      background: rgba(7, 66, 36, 0.95);
      border: 3px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 18px 35px rgba(0,0,0,0.35);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtitle {
      color: var(--muted);
      text-align: center;
      margin: 0 0 16px;
    }

    .hidden { display: none !important; }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    .auth-box, .room-box, .shop-box, .panel {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 12px 14px;
      margin-top: 12px;
    }

    input, button {
      font: inherit;
    }

    input {
      min-width: 180px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.16);
      color: white;
      font-weight: 700;
    }

    button {
      appearance: none;
      border: none;
      background: var(--accent);
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease;
      box-shadow: 0 8px 16px rgba(0,0,0,0.18);
    }

    button:hover:not(:disabled) {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    button.secondary {
      background: #4a3a29;
    }

    button.secondary:hover:not(:disabled) {
      background: #352918;
    }

    button.danger {
      background: var(--danger);
    }

    button.danger:hover:not(:disabled) {
      background: #c92f2f;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      text-align: center;
      padding: 10px;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--gold);
    }

    .board {
      display: grid;
      gap: 16px;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      min-height: 170px;
    }

    .card {
      width: 96px;
      height: 140px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 2px solid #d9d0bf;
      box-shadow: 0 8px 14px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 10px;
      color: #1c1c1c;
      font-weight: 800;
      user-select: none;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .card.selected {
      border-color: #d7b12d;
      box-shadow: 0 0 0 3px rgba(244,210,106,0.6), 0 10px 18px rgba(0,0,0,0.18);
      transform: translateY(-4px);
      background: #fff6d3;
    }

    .card.red { color: #d72828; }
    .card.black { color: #1a1a1a; }

    .card .top,
    .card .bottom {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .card .middle {
      font-size: 2rem;
      text-align: center;
      line-height: 1;
      margin: 0 auto;
    }

    .players {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .player {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 12px;
      color: white;
    }

    .player strong {
      display: block;
      margin-bottom: 5px;
    }

    .dealer-badge {
      color: var(--gold);
      font-weight: 800;
    }

    .status {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      min-height: 72px;
      margin-top: 10px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 12px;
      color: var(--text);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .shop-items {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .shop-item {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px;
    }

    .shop-item h4 {
      margin: 0 0 8px;
      font-size: 1rem;
    }

    .shop-item p {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .showdown {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
    }

    .showdown h3 {
      margin: 0 0 8px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .showdown ul {
      margin: 0;
      padding-left: 20px;
      line-height: 1.6;
    }

    @media (max-width: 700px) {
      .card {
        width: 76px;
        height: 110px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>5 Card Draw</h1>
    <p class="subtitle">Multiplayer poker with accounts, debt, and cosmetics</p>

    <div id="authPanel" class="auth-box">
      <div class="row">
        <input id="username" placeholder="Username" maxlength="20" />
        <input id="password" type="password" placeholder="Password" maxlength="24" />
      </div>
      <div class="row" style="margin-top:12px;">
        <button id="registerBtn">Register</button>
        <button id="loginBtn" class="secondary">Login</button>
      </div>
    </div>

    <div id="lobbyPanel" class="hidden">
      <div class="row">
        <button id="openShopBtn" class="secondary">Shop</button>
        <button id="logOutBtn" class="danger">Logout</button>
      </div>

      <div class="row" style="margin-top:12px;">
        <input id="roomCodeInput" maxlength="5" placeholder="Room code" />
        <button id="joinRoomBtn" class="secondary">Join Room</button>
        <button id="createRoomBtn">Create Room</button>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Balance</span>
          <span id="balanceValue" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Debt</span>
          <span id="debtValue" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Theme</span>
          <span id="themeValue" class="stat-value">Classic</span>
        </div>
        <div class="stat">
          <span class="stat-label">Cards</span>
          <span id="cardBackValue" class="stat-value">Classic</span>
        </div>
      </div>
    </div>

    <div id="shopPanel" class="shop-box hidden">
      <div class="row">
        <button id="closeShopBtn" class="secondary">Close Shop</button>
      </div>
      <div id="shopItems" class="shop-items"></div>
    </div>

    <div id="gamePanel" class="hidden">
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Room</span>
          <span id="roomCodeDisplay" class="stat-value">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Dealer</span>
          <span id="dealerDisplay" class="stat-value">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Pot</span>
          <span id="potDisplay" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Current Bet</span>
          <span id="currentBetDisplay" class="stat-value">0</span>
        </div>
      </div>

      <div id="status" class="status">
        Waiting for room...
      </div>

      <div class="board">
        <div class="panel">
          <div class="panel-header" style="display:flex;justify-content:space-between;">
            <span>Players</span>
            <span id="roundInfo">Lobby</span>
          </div>
          <div id="players" class="players"></div>
        </div>

        <div class="panel">
          <div class="panel-header" style="display:flex;justify-content:space-between;">
            <span>Your Hand</span>
            <span id="handStatus">Waiting</span>
          </div>
          <div id="selfCards" class="cards"></div>
        </div>

        <div class="actions">
          <button id="checkBtn" class="secondary">Check</button>
          <button id="callBtn" class="secondary">Call</button>
          <button id="raiseBtn" class="secondary">Raise</button>
          <button id="foldBtn" class="danger">Fold</button>
          <button id="standBtn" class="secondary">Stand</button>
          <button id="discardBtn">Discard & Draw</button>
        </div>

        <div class="row" style="margin-top:12px;">
          <input id="raiseInput" type="number" min="10" step="10" value="25" placeholder="Raise amount" />
        </div>
      </div>

      <div id="showdown" class="showdown hidden"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const state = {
      user: null,
      roomCode: "",
      myId: "",
      phase: "lobby",
      players: [],
      myHand: [],
      selected: [],
      currentPot: 0,
      currentBet: 0,
      showdown: null,
      lastStatus: "",
      theme: "classic",
      cardBack: "classic"
    };

    const authPanel = document.getElementById("authPanel");
    const lobbyPanel = document.getElementById("lobbyPanel");
    const shopPanel = document.getElementById("shopPanel");
    const gamePanel = document.getElementById("gamePanel");
    const statusEl = document.getElementById("status");
    const playersEl = document.getElementById("players");
    const selfCardsEl = document.getElementById("selfCards");
    const showdownEl = document.getElementById("showdown");
    const roomCodeDisplay = document.getElementById("roomCodeDisplay");
    const dealerDisplay = document.getElementById("dealerDisplay");
    const potDisplay = document.getElementById("potDisplay");
    const currentBetDisplay = document.getElementById("currentBetDisplay");
    const roundInfo = document.getElementById("roundInfo");
    const handStatus = document.getElementById("handStatus");
    const balanceValue = document.getElementById("balanceValue");
    const debtValue = document.getElementById("debtValue");
    const themeValue = document.getElementById("themeValue");
    const cardBackValue = document.getElementById("cardBackValue");

    function applyTheme(theme) {
      const root = document.documentElement;
      if (theme === "royal") {
        root.style.setProperty("--theme-bg", "#0d1b4d");
        root.style.setProperty("--theme-table", "#152d80");
      } else if (theme === "midnight") {
        root.style.setProperty("--theme-bg", "#111827");
        root.style.setProperty("--theme-table", "#1f2937");
      } else if (theme === "fire") {
        root.style.setProperty("--theme-bg", "#4b1d1d");
        root.style.setProperty("--theme-table", "#7a2b2b");
      } else {
        root.style.setProperty("--theme-bg", "#0a4f2a");
        root.style.setProperty("--theme-table", "#0d6d3d");
      }
    }

    function applyCardBack(cardBack) {
      const root = document.documentElement;
      if (cardBack === "gold") {
        root.style.setProperty("--card-back", "#d6b459");
      } else if (cardBack === "neon") {
        root.style.setProperty("--card-back", "#14d9e5");
      } else {
        root.style.setProperty("--card-back", "#1d4f7d");
      }
    }

    function renderShop(items) {
      const shopItems = document.getElementById("shopItems");
      shopItems.innerHTML = "";
      items.forEach((item) => {
        const div = document.createElement("div");
        div.className = "shop-item";
        div.innerHTML = `
          <h4>${item.name}</h4>
          <p>${item.owned ? "Owned" : `Cost: ${item.cost} chips`}</p>
          <button data-item-id="${item.id}" data-owned="${item.owned}">
            ${item.owned ? "Equip" : "Buy"}
          </button>
        `;
        div.querySelector("button").addEventListener("click", () => {
          if (!state.user) return;
          if (item.owned) {
            socket.emit("setActiveCosmetic", { userId: state.user.id, itemId: item.id });
          } else {
            socket.emit("buyItem", { userId: state.user.id, itemId: item.id });
          }
        });
      });
    }

    function setLoggedIn(user) {
      state.user = user;
      state.theme = user.theme || "classic";
      state.cardBack = user.cardBack || "classic";
      applyTheme(state.theme);
      applyCardBack(state.cardBack);

      balanceValue.textContent = user.chips;
      debtValue.textContent = user.debt;
      themeValue.textContent = user.theme || "Classic";
      cardBackValue.textContent = user.cardBack || "Classic";

      authPanel.classList.add("hidden");
      lobbyPanel.classList.remove("hidden");
      gamePanel.classList.add("hidden");
      shopPanel.classList.add("hidden");
    }

    function setLoggedOut() {
      state.user = null;
      state.roomCode = "";
      state.myId = "";
      authPanel.classList.remove("hidden");
      lobbyPanel.classList.add("hidden");
      gamePanel.classList.add("hidden");
      shopPanel.classList.add("hidden");
    }

    function renderSelfCards() {
      selfCardsEl.innerHTML = "";
      state.myHand.forEach((card, index) => {
        const cardEl = document.createElement("div");
        const selected = state.selected.includes(index);
        cardEl.className = "card " + (card.suit === "♥" || card.suit === "♦" ? "red" : "black") + (selected ? " selected" : "");
        cardEl.innerHTML = `
          <div class="top">
            <span>${card.rank}</span>
            <span>${card.suit}</span>
          </div>
          <div class="middle">${card.suit}</div>
          <div class="bottom">
            <span>${card.suit}</span>
            <span>${card.rank}</span>
          </div>
        `;
        cardEl.onclick = () => {
          if (state.phase !== "draw1" && state.phase !== "draw2") return;
          if (state.selected.includes(index)) {
            state.selected = state.selected.filter((i) => i !== index);
          } else {
            state.selected.push(index);
          }
          renderSelfCards();
        };
        selfCardsEl.appendChild(cardEl);
      });
    }

    function renderPlayers() {
      playersEl.innerHTML = "";
      state.players.forEach((player) => {
        const playerEl = document.createElement("div");
        playerEl.className = "player";

        const dealerBadge = player.isDealer ? " <span class='dealer-badge'>🃏 Dealer</span>" : "";
        playerEl.innerHTML = `
          <strong>${player.name}${dealerBadge}</strong>
          <div>Chips: ${player.chips}</div>
          <div>Debt: ${player.debt}</div>
          <div>Status: ${player.ready ? "Ready" : (player.folded ? "Folded" : (player.stood ? "Stand" : "Waiting"))}</div>
          <div>Last action: ${player.lastAction}</div>
        `;
        playersEl.appendChild(playerEl);
      });
    }

    function renderShowdown() {
      if (!state.showdown) return;

      showdownEl.classList.remove("hidden");
      showdownEl.innerHTML = `
        <h3>Showdown</h3>
        <ul>
          ${state.showdown.results.map((p) =>
            `<li><strong>${p.name}</strong> — ${p.handName}</li>`
          ).join("")}
        </ul>
        <p><strong>${state.showdown.winnerName}</strong> wins the ${state.showdown.pot} chip pot.</p>
      `;
    }

    function refreshHud() {
      roomCodeDisplay.textContent = state.roomCode || "—";
      dealerDisplay.textContent = state.players.find((p) => p.isDealer)?.name || "—";
      potDisplay.textContent = state.currentPot;
      currentBetDisplay.textContent = state.currentBet;

      if (state.phase === "lobby") {
        roundInfo.textContent = "Lobby";
      } else if (state.phase === "draw1") {
        roundInfo.textContent = "Draw 1";
      } else if (state.phase === "draw2") {
        roundInfo.textContent = "Draw 2";
      } else if (state.phase === "bet1") {
        roundInfo.textContent = "Bet 1";
      }

      if (state.phase === "draw1" || state.phase === "draw2") {
        handStatus.textContent = "Discard mode";
      } else {
        handStatus.textContent = "Waiting";
      }

      renderPlayers();
      renderSelfCards();
      renderShowdown();
    }

    document.getElementById("registerBtn").addEventListener("click", () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      socket.emit("register", { username, password });
    });

    document.getElementById("loginBtn").addEventListener("click", () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      socket.emit("login", { username, password });
    });

    document.getElementById("logOutBtn").addEventListener("click", () => {
      setLoggedOut();
    });

    document.getElementById("openShopBtn").addEventListener("click", () => {
      socket.emit("getShop", { userId: state.user.id });
      shopPanel.classList.remove("hidden");
      gamePanel.classList.add("hidden");
    });

    document.getElementById("closeShopBtn").addEventListener("click", () => {
      shopPanel.classList.add("hidden");
      gamePanel.classList.remove("hidden");
    });

    document.getElementById("createRoomBtn").addEventListener("click", () => {
      if (!state.user) return;
      socket.emit("createRoom", { userId: state.user.id });
    });

    document.getElementById("joinRoomBtn").addEventListener("click", () => {
      if (!state.user) return;
      const code = document.getElementById("roomCodeInput").value.trim().toUpperCase();
      socket.emit("joinRoom", { userId: state.user.id, code });
    });

    document.getElementById("checkBtn").addEventListener("click", () => {
      if (!state.roomCode) return;
      socket.emit("betAction", { code: state.roomCode, action: "check", amount: 0 });
    });

    document.getElementById("callBtn").addEventListener("click", () => {
      if (!state.roomCode) return;
      socket.emit("betAction", { code: state.roomCode, action: "call", amount: 0 });
    });

    document.getElementById("raiseBtn").addEventListener("click", () => {
      if (!state.roomCode) return;
      const amount = Number(document.getElementById("raiseInput").value) || 25;
      socket.emit("betAction", { code: state.roomCode, action: "raise", amount });
    });

    document.getElementById("foldBtn").addEventListener("click", () => {
      if (!state.roomCode) return;
      socket.emit("betAction", { code: state.roomCode, action: "fold", amount: 0 });
    });

    document.getElementById("standBtn").addEventListener("click", () => {
      if (!state.roomCode) return;
      socket.emit("betAction", { code: state.roomCode, action: "stand", amount: 0 });
    });

    document.getElementById("discardBtn").addEventListener("click", () => {
      if (!state.roomCode) return;
      socket.emit("discardCards", {
        code: state.roomCode,
        cards: state.selected
      });
      state.selected = [];
      renderSelfCards();
    });

    socket.on("authResult", ({ success, message, user }) => {
      if (!success) {
        alert(message);
        return;
      }

      setLoggedIn(user);
      if (user.inventory) {
        const inventory = user.inventory;
        console.log("Player inventory:", inventory);
      }
    });

    socket.on("joinedRoom", ({ code, userId, username }) => {
      state.roomCode = code;
      state.myId = userId;
      authPanel.classList.add("hidden");
      lobbyPanel.classList.add("hidden");
      gamePanel.classList.remove("hidden");
      shopPanel.classList.add("hidden");
      refreshHud();
    });

    socket.on("roomState", ({ code, phase, players, currentPot, currentBet, lastMessage, roundNumber }) => {
      state.roomCode = code;
      state.phase = phase;
      state.players = players;
      state.currentPot = currentPot;
      state.currentBet = currentBet;
      statusEl.textContent = lastMessage || "Waiting for room...";
      refreshHud();
    });

    socket.on("yourCards", ({ hand, chips, debt, phase, currentPot, currentBet, roundNumber, dealerIndex }) => {
      state.myHand = hand;
      state.phase = phase;
      state.currentPot = currentPot;
      state.currentBet = currentBet;
      if (state.user) {
        state.user.chips = chips;
        state.user.debt = debt;
        balanceValue.textContent = chips;
        debtValue.textContent = debt;
      }
      refreshHud();
    });

    socket.on("error", ({ message }) => {
      alert(message);
    });

    socket.on("shopState", ({ items }) => {
      renderShop(items);
    });

    socket.on("shopResult", ({ success, message }) => {
      if (success) {
        alert(message);
      } else {
        alert(message);
      }
      if (state.user) {
        socket.emit("getShop", { userId: state.user.id });
      }
    });

    socket.on("showdown", ({ winnerName, pot, results, explanation }) => {
      state.showdown = { winnerName, pot, results };
      statusEl.textContent = explanation || `${winnerName} wins!`;
      refreshHud();
    });

    refreshHud();
  </script>
</body>
</html>
